name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Lint, type-check, proto validation, and unit tests.
  # ----------------------------------------------------------------------------
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        # cpu/gpu/openvino runtime extras conflict (same import package); CI
        # exercises the CPU wheel plus the viz extra.
        run: uv sync --extra cpu --extra viz

      - name: Generate protobuf stubs
        run: uv run python scripts/gen_proto.py

      - name: Verify generated stubs are checked in and up to date
        run: |
          git diff --exit-code -- src/onnx_grpc_benchmark/generated \
            || (echo "Generated stubs are stale. Run 'make proto' and commit." && exit 1)

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Format check
        run: uv run ruff format --check src tests scripts

      - name: Type check
        run: uv run mypy src

      - name: Test
        # The CPU runtime lives in the ``cpu`` extra (mutually exclusive with
        # gpu/openvino); pull it in for the test run.
        run: uv run --extra cpu pytest --cov=onnx_grpc_benchmark --cov-report=term-missing

  # ----------------------------------------------------------------------------
  # Build the CPU Docker image and smoke-test the resulting artifact: start the
  # gRPC server in the container and benchmark it end-to-end. Runs only after
  # the quality gate passes. Does NOT push — publishing lives in publish.yml.
  # ----------------------------------------------------------------------------
  docker:
    name: Build & Smoke-test Image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CPU image (load to local daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: onnx-grpc-benchmark:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the server container
        run: |
          docker run -d --name onnx-server -p 50051:50051 \
            onnx-grpc-benchmark:ci
          echo "Waiting for the server to come up..."
          for i in $(seq 1 30); do
            if docker exec onnx-server \
                python -c "from onnx_grpc_benchmark.server.client import InferenceClient; \
                           c=InferenceClient('localhost:50051'); c.wait_ready(2); \
                           print(c.health().version)" 2>/dev/null; then
              echo "server is ready"
              break
            fi
            sleep 1
            if [ "$i" -eq 30 ]; then
              echo "server did not become ready" >&2
              docker logs onnx-server
              exit 1
            fi
          done

      - name: Benchmark the running image end-to-end
        run: |
          docker exec onnx-server \
            onnx-bench grpc \
              --address localhost:50051 \
              --ref-model /models/tiny_mlp.onnx \
              --iterations 50 \
              --warmup 5 \
              --out /results/ci_grpc.json
          echo "--- result summary ---"
          docker exec onnx-server python -c "import json; \
            d=json.load(open('/results/ci_grpc.json')); \
            assert d['stats']['count']==50, d['stats']; \
            print('p50_ms', round(d['stats']['p50_ms'],4), \
                  'server_inference', 'server_inference' in d['extra'])"

      - name: Dump server logs
        if: always()
        run: docker logs onnx-server || true

      - name: Tear down
        if: always()
        run: docker rm -f onnx-server || true
