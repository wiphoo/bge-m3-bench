name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Generate protobuf stubs
        run: uv run python scripts/gen_proto.py

      - name: Verify generated stubs are checked in and up to date
        run: |
          git diff --exit-code -- src/onnx_grpc_benchmark/generated \
            || (echo "Generated stubs are stale. Run 'make proto' and commit." && exit 1)

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Format check
        run: uv run ruff format --check src tests scripts

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest --cov=onnx_grpc_benchmark --cov-report=term-missing
