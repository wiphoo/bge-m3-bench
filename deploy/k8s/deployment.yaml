apiVersion: apps/v1
kind: Deployment
metadata:
  name: onnx-grpc-benchmark
  labels:
    app: onnx-grpc-benchmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onnx-grpc-benchmark
  template:
    metadata:
      labels:
        app: onnx-grpc-benchmark
    spec:
      containers:
        - name: server
          image: ghcr.io/wiphoo/bge-m3-bench:latest
          imagePullPolicy: IfNotPresent
          args: ["--model", "/models/tiny_mlp.onnx", "--provider", "cpu"]
          ports:
            - name: grpc
              containerPort: 50051
          env:
            # Surfaced into benchmark metadata (Milestone 9: pod metadata).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: onnx-grpc-benchmark
spec:
  selector:
    app: onnx-grpc-benchmark
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
