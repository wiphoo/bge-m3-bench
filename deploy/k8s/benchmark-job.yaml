apiVersion: batch/v1
kind: Job
metadata:
  name: onnx-grpc-benchmark-run
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: onnx-grpc-benchmark-run
    spec:
      restartPolicy: Never
      containers:
        - name: bench
          image: ghcr.io/wiphoo/bge-m3-bench:latest
          # Pod metadata is attached to results via the env vars below.
          command: ["onnx-bench", "grpc"]
          args:
            - "--address"
            - "onnx-grpc-benchmark:50051"
            - "--ref-model"
            - "/models/tiny_mlp.onnx"
            - "--iterations"
            - "200"
            - "--out"
            - "/results/k8s_run.json"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: results
          emptyDir: {}
