[project]
name = "onnx-grpc-benchmark"
version = "0.1.0"
description = "Production-ready gRPC service wrapping ONNX Runtime with a reproducible benchmark platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "bge-m3-bench maintainers" }]
dependencies = [
    "onnxruntime>=1.17",
    "onnx>=1.15",
    "numpy>=1.24",
    "grpcio>=1.80.0",
    "grpcio-health-checking>=1.80.0",
    "protobuf>=6.31.1",
    "psutil>=5.9",
    "click>=8.1",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7",
    "pandas>=2.0",
    "jupyter>=1.0",
    "nbformat>=5.9",
    "nbconvert>=7.0",
]
gpu = ["onnxruntime-gpu>=1.17"]
openvino = ["onnxruntime-openvino>=1.17"]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "grpcio-tools>=1.80.0",
    "types-protobuf>=4.25",
    "pre-commit>=3.7",
]

[project.scripts]
onnx-bench = "onnx_grpc_benchmark.benchmark.cli:cli"
onnx-server = "onnx_grpc_benchmark.server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onnx_grpc_benchmark"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/onnx_grpc_benchmark/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["src/onnx_grpc_benchmark/generated", "build"]

[[tool.mypy.overrides]]
# Generated protobuf stubs are untyped; treat their symbols as Any so callers
# type-check without re-deriving the proto types.
module = "onnx_grpc_benchmark.generated.*"
ignore_errors = true
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
