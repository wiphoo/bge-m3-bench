[project]
name = "bge-m3-bench"
version = "0.1.0"
description = "BGE-M3 embedding benchmark over gRPC: tokenize + ONNX inference with raw JSONL metrics"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "bge-m3-bench maintainers" }]
dependencies = [
    "onnxruntime>=1.17",
    "numpy>=1.24",
    "grpcio>=1.80.0",
    "grpcio-health-checking>=1.80.0",
    "grpcio-reflection>=1.80.0",
    "protobuf>=6.31.1",
    "psutil>=5.9",
    "click>=8.1",
    "tokenizers>=0.15",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "grpcio-tools>=1.80.0",
    "types-protobuf>=4.25",
    "onnx>=1.15",
    "pre-commit>=3.7",
]
# Optional: build model artifacts via `make model` (real BGE-M3 export + fp16/int8
# conversion). Kept out of the core install; pull in with `uv sync --group export`.
export = [
    "onnx>=1.15",
    "sympy>=1.12",
    "transformers>=4.40",
    "torch>=2.2",
    "optimum[onnxruntime]>=1.20",
]

[project.scripts]
bge-m3-server = "bge_m3_bench.server.__main__:main"
bge-m3-bench = "bge_m3_bench.bench.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bge_m3_bench"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/bge_m3_bench/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["src/bge_m3_bench/generated", "build"]

[[tool.mypy.overrides]]
module = "bge_m3_bench.generated.*"
ignore_errors = true
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
